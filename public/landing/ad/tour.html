<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --surround:#030304; --void:#0a0a0c; --ink:#ececec; --muted:#9a9a9a;
  --audio:#2ECC71; --signal:#F1C40F; --number:#3498DB; --gate:#E74C3C; --wave:#9B59B6; --gold:#e9d3a8;
  --font:'DejaVu Sans','Roboto',system-ui,sans-serif;
  --serif:ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--surround);overflow:hidden;color:var(--ink);font-family:var(--font)}
#frame{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0c0c10 0%,#030304 72%)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform-origin:50% 50%;overflow:hidden;background:var(--void);border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.035),0 30px 140px rgba(0,0,0,.85);cursor:pointer;user-select:none;-webkit-user-select:none;opacity:0;transition:opacity .9s ease}
#stage.ready{opacity:1}
.layer{position:absolute;pointer-events:none}
#dots1{left:-120px;top:-120px;width:1840px;height:1240px;background-image:radial-gradient(circle,rgba(255,255,255,.075) 1.1px,transparent 1.7px);background-size:24px 24px;will-change:transform}
#dots2{left:-160px;top:-160px;width:1920px;height:1320px;background-image:radial-gradient(circle,rgba(255,255,255,.045) 1.9px,transparent 2.7px);background-size:72px 72px;will-change:transform}
#neb{inset:-80px;background:
  radial-gradient(620px 440px at 24% 30%,rgba(46,204,113,.075),transparent 70%),
  radial-gradient(720px 520px at 78% 72%,rgba(155,89,182,.085),transparent 70%),
  radial-gradient(520px 420px at 62% 18%,rgba(52,152,219,.05),transparent 70%);will-change:transform}
#world{position:absolute;inset:0;perspective:1400px;perspective-origin:800px 500px}
.panel{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;border-radius:14px;overflow:hidden;background:#151515;box-shadow:0 40px 120px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.08);will-change:transform,opacity,filter;display:block;visibility:hidden}
.panel img{display:block;width:1440px;height:900px;-webkit-user-drag:none}
/* ---- live stage (the app's own three.js scene + its overlays, 1:1 from StageLanding.tsx) ---- */
.livehost{position:relative;width:1440px;height:900px;background:#030102;overflow:hidden;font-family:system-ui,sans-serif}
.livehost canvas{position:absolute;inset:0;width:1440px;height:900px;display:block}
.lv-gate,.lv-piano{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.lv-gate{gap:16px;padding:112px 16px 40px;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.45),transparent)}
.lv-gate .eyebrow{margin:0;font:13px ui-serif,Georgia,Cambria,"Times New Roman",Times,serif;letter-spacing:.4em;text-transform:uppercase;color:rgba(233,211,168,.8)}
.lv-gate .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
.lv-gate .start{border-radius:999px;border:1px solid rgba(233,211,168,.4);background:rgba(255,255,255,.08);padding:16px 40px;font:20px system-ui,sans-serif;color:#e6e6e6;box-shadow:0 0 48px rgba(255,190,110,.28);backdrop-filter:blur(12px);outline:2px solid #e9d3a8;outline-offset:4px}
.lv-gate .piano{border-radius:999px;border:1px solid rgba(233,211,168,.25);background:rgba(0,0,0,.3);padding:16px 28px;font:18px system-ui,sans-serif;color:#e9d3a8;backdrop-filter:blur(12px)}
.lv-gate .note{margin:0;font-size:13px;color:rgba(216,199,168,.75)}
.lv-piano{gap:12px;padding:96px 16px 32px;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.5),transparent)}
.lv-piano .hint{margin:0;font-size:14px;color:#e9d3a8}
.lv-piano .oct{margin:0;font-size:12px;color:rgba(216,199,168,.75)}
.lv-piano .oct b{font-weight:600;color:#e9d3a8}
.lv-piano .oct span{border-radius:4px;border:1px solid rgba(233,211,168,.3);padding:0 6px;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.lv-piano .enter{border-radius:999px;border:1px solid rgba(233,211,168,.4);background:rgba(255,255,255,.08);padding:12px 32px;font:16px system-ui,sans-serif;color:#e6e6e6;backdrop-filter:blur(12px)}
.lv-back{position:absolute;top:20px;left:20px;border-radius:999px;border:1px solid rgba(233,211,168,.3);background:rgba(0,0,0,.4);padding:8px 20px;font:14px system-ui,sans-serif;color:#e9d3a8;backdrop-filter:blur(12px)}
.lv-keys{position:relative;height:92px;width:340px}
.lv-keys .pk{position:absolute;top:0;display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box;border-radius:0 0 6px 6px;font-weight:600;text-transform:uppercase;transition:background-color 75ms,color 75ms}
.lv-keys .w{height:92px;width:32px;border:1px solid rgba(0,0,0,.6);padding-bottom:6px;font-size:12px;background:#efe9dc;color:rgba(0,0,0,.6)}
.lv-keys .b{height:56px;width:20px;z-index:10;padding-bottom:4px;font-size:11px;background:#141414;color:rgba(255,255,255,.7)}
.lv-keys .w.down{background:#f3cf8a;color:#000}
.lv-keys .b.down{background:#c9973f;color:#000}

.panel iframe{border:0;display:block;width:1440px;height:900px;pointer-events:none;background:#1e1e1e;color-scheme:dark}
#vig{inset:0;background:radial-gradient(ellipse 78% 72% at 50% 48%,transparent 52%,rgba(0,0,0,.6) 100%)}
#fx{position:absolute;left:0;top:0;width:1600px;height:1000px;pointer-events:none}
#scrimB{left:0;right:0;bottom:0;height:300px;background:linear-gradient(to bottom,rgba(6,6,8,0),rgba(6,6,8,.8) 62%,rgba(6,6,8,.93));opacity:0}
#scrimT{left:0;right:0;top:0;height:250px;background:linear-gradient(to top,rgba(0,0,0,0),rgba(0,0,0,.74));opacity:0}
.cap{position:absolute;left:0;right:0;bottom:54px;text-align:center;opacity:0;will-change:opacity,transform,filter;pointer-events:none}
.cap .eb{display:inline-flex;align-items:center;gap:11px;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:14px;font-weight:500}
.cap .ln{font-size:34px;line-height:1.25;color:#efefef;font-weight:400;text-shadow:0 2px 24px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.8);padding:0 80px}
.cap.stage{top:50px;bottom:auto}
.cap.stage .eb{font-family:var(--serif);color:rgba(233,211,168,.85);letter-spacing:.44em;font-size:15px;font-weight:400}
.cap.stage .ln{font-family:var(--serif);color:#f3e6c9;font-size:38px;letter-spacing:.01em;text-shadow:0 0 30px rgba(255,190,110,.35),0 2px 20px rgba(0,0,0,.95)}
.g{width:12px;height:12px;background:var(--acc);display:inline-block;box-shadow:0 0 12px var(--acc)}
.g.audio{clip-path:polygon(30% 0,100% 0,70% 100%,0 100%);width:17px}
.g.signal{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:14px;height:14px}
.g.number{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);width:15px;height:13px}
.g.wave{border-radius:50%}
#logo{inset:0;opacity:0;display:none}
#mark{position:absolute;left:680px;top:250px;width:240px;height:240px;overflow:visible;color:#ececec;filter:drop-shadow(0 0 14px rgba(255,255,255,.12))}
#word{position:absolute;left:0;right:0;top:520px;text-align:center;font-size:104px;font-weight:300;letter-spacing:.015em;color:#f2f2f2;text-shadow:0 0 40px rgba(255,255,255,.12)}
#word span{display:inline-block;will-change:transform,opacity,filter}
#tag{position:absolute;left:0;right:0;top:668px;text-align:center;font-size:27px;color:#bdbdbd;letter-spacing:.01em}
/* C's warm stage spotlight (intro + ending) */
#beam{position:absolute;inset:0;opacity:0;pointer-events:none}
#beam .soft{position:absolute;inset:0;filter:blur(28px)}
#beam .cone{position:absolute;left:0;right:0;top:-40px;bottom:0;
  clip-path:polygon(44% 0,56% 0,82% 100%,18% 100%);
  background:linear-gradient(to bottom,rgba(255,228,178,.30),rgba(255,214,160,.12) 55%,rgba(255,200,140,.035) 88%,transparent)}
#beam .pool{position:absolute;inset:0;background:radial-gradient(ellipse 34% 12% at 50% 90%,rgba(255,196,130,.15),transparent 70%)}
#trov{position:absolute;left:0;top:0;width:1600px;height:1000px;pointer-events:none;overflow:visible}
#motes{position:absolute;left:0;top:0;width:1600px;height:1000px;pointer-events:none}
#intro{position:absolute;left:0;right:0;top:474px;text-align:center;font-family:var(--serif);font-size:24px;letter-spacing:.9em;padding-left:.9em;color:var(--gold);opacity:0;pointer-events:none;text-shadow:0 0 18px rgba(255,210,150,.35)}
#intro span{display:inline-block;opacity:0;filter:blur(8px);transition:opacity .9s ease,filter .9s ease}
#intro span.on{opacity:1;filter:none}
/* A's final slide: the mark draws itself, the nodes bloom, the dust gathers */
#finale{position:absolute;inset:0;opacity:0;pointer-events:none}
#finale .mark{position:absolute;left:680px;top:212px;width:240px;height:240px;color:#ececec;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,255,255,.12))}
#finale .mark path{stroke-dasharray:1;stroke-dashoffset:1}
#finale .mark circle{transform-box:fill-box;transform-origin:center;transform:scale(0)}
#finale.on .mark path{transition:stroke-dashoffset 1.1s cubic-bezier(.6,0,.2,1);stroke-dashoffset:0}
#finale.on .mark circle{transition:transform .7s cubic-bezier(.3,1.6,.4,1);transform:scale(1)}
#finale .word{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:104px;font-weight:300;letter-spacing:.015em;color:#f2f2f2;text-shadow:0 0 40px rgba(255,255,255,.12);opacity:0;transform:translateY(12px);filter:blur(10px);transition:all 1.2s cubic-bezier(.2,.7,.2,1) 1.4s}
#finale .tag{position:absolute;left:0;right:0;top:650px;text-align:center;font-size:27px;color:#bdbdbd;letter-spacing:.01em;opacity:0;filter:blur(6px);transition:all 1.2s ease 2.2s}
#finale.on .word,#finale.on .tag{opacity:1;transform:none;filter:none}
.embed #bar,.embed #hud{display:none!important}
#bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.07);pointer-events:none}
#bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#2ECC71,#F1C40F 30%,#3498DB 55%,#E74C3C 78%,#9B59B6)}
#bar b{position:absolute;top:0;width:1px;height:3px;background:rgba(0,0,0,.6)}
#hud{position:absolute;right:22px;top:20px;padding:8px 16px;border-radius:999px;background:rgba(20,20,22,.78);border:1px solid rgba(255,255,255,.1);font-size:14px;color:#cfcfcf;letter-spacing:.02em;opacity:0;transition:opacity .25s;pointer-events:none}
#hud.on{opacity:1}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--muted);font-size:14px;letter-spacing:.08em;transition:opacity .6s ease}
#loader.gone{opacity:0;pointer-events:none}
#loader svg{width:56px;height:56px;color:#d8d8d8}
#loader circle.n{animation:lp 1.6s ease-in-out infinite}
#loader circle.n:nth-of-type(2){animation-delay:.15s}#loader circle.n:nth-of-type(3){animation-delay:.3s}
#loader circle.n:nth-of-type(4){animation-delay:.45s}#loader circle.n:nth-of-type(5){animation-delay:.6s}
@keyframes lp{0%,100%{opacity:.35}50%{opacity:1}}
.lbar{width:160px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ECC71,#F1C40F,#3498DB,#E74C3C,#9B59B6);transition:width .3s}
@media (prefers-reduced-motion: reduce){ #loader circle.n{animation:none;opacity:.9} }
</style>
</head>

    <div id="vig" class="layer"></div>

        <g fill="none" stroke-width="3" stroke-linecap="round">
          <path pathLength="1" d="M32 52 Q14 54 6.9 45.3" stroke="#2ECC71" style="transition-delay:.15s"/>

    <div id="logo" class="layer">
      <svg id="mark" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="none" stroke-width="3" stroke-linecap="round">
          <path class="lw" d="M32 52 Q14 54 6.9 45.3" stroke="#2ECC71"/>

/* ---------- frame ---------- */
const barEl = $('#bar i'), scrimB = $('#scrimB'), scrimT = $('#scrimT'), hud = $('#hud');
